name: TRAE 每日签到
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取积分接口 usage 结构（诊断用，临时）
        env:
          AUTH: ${{ secrets.TRAE_AUTH_1 }}
        run: |
          TOKEN=$(python3 -c "import os,json;d=json.loads(os.environ['AUTH']);print(d['auth']['accessToken'])")
          curl -s -X POST "https://api.trae.cn/trae/api/v2/pay/ide_user_ent_usage" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'User-Agent: Trae/0.1.43' \
            -H 'X-User-Region: CN' \
            -H "Authorization: Cloud-IDE-JWT $TOKEN" \
            -d '{}' | python3 -c "
import json,sys,base64
d=json.load(sys.stdin)
n=0
for p in d.get('user_entitlement_pack_list',[]):
    n+=1
    ub=base64.b64encode(json.dumps(p.get('usage') or {}).encode()).decode()
    print('pack{} group={} usage_b64={}'.format(n,p.get('group_name'),ub))
"
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 写入账号凭证
        env:
          TRAE_AUTH: ${{ secrets.TRAE_AUTH_1 }}
        run: |
          mkdir -p auths
          printf '%s' "$TRAE_AUTH" > auths/trae-1.json

      - name: 执行签到并推送通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          chmod +x signin.sh
          bash signin.sh auths