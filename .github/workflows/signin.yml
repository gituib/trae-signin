name: TRAE 每日签到
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 写入账号凭证
        env:
          TRAE_AUTH_1: ${{ secrets.TRAE_AUTH_1 }}
          TRAE_AUTH_2: ${{ secrets.TRAE_AUTH_2 }}
          TRAE_AUTH_3: ${{ secrets.TRAE_AUTH_3 }}
          TRAE_AUTH_4: ${{ secrets.TRAE_AUTH_4 }}
          TRAE_AUTH_5: ${{ secrets.TRAE_AUTH_5 }}
        run: |
          mkdir -p auths
          for i in 1 2 3 4 5; do
            var="TRAE_AUTH_$i"
            val="${!var}"
            if [ -n "$val" ]; then
              printf '%s' "$val" > "auths/trae-$i.json"
              echo "✅ 已写入账号 $i"
            fi
          done
          ls auths/

      - name: 运行签到
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          TZ: Asia/Shanghai
        run: |
          bash signin.sh