name: TRAE 每日签到
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 写入账号凭证
        env:
          TRAE_AUTH: ${{ secrets.TRAE_AUTH_1 }}
        run: |
          mkdir -p auths
          printf '%s' "$TRAE_AUTH" > auths/trae-1.json

      - name: 抓取 usage 字段（诊断用，待移除）
        run: |
          python3 -c 'import json,base64 as b,urllib.request as u;d=json.load(open("auths/trae-1.json"));tok=d["auth"]["accessToken"];r=json.loads(u.urlopen(u.Request("https://api.trae.cn/trae/api/v2/pay/ide_user_ent_usage",data=b"{}",method="POST",headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"Trae/0.1.43","X-User-Region":"CN","Authorization":"Cloud-IDE-JWT "+tok}),timeout=20).read().decode());print("top_keys:","|".join(r.keys()));[print("pack%d group=%s status=%s limit=%s usage_b64=%s"%(i,p.get("group_name"),p.get("status"),(p.get("entitlement_base_info") or {}).get("quota",{}).get("credits_limit"),b.b64encode(json.dumps(p.get("usage") or {},ensure_ascii=False).encode()).decode())) for i,p in enumerate(r.get("user_entitlement_pack_list") or [],1)]'

      - name: 执行签到并推送通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          chmod +x signin.sh
          bash signin.sh auths