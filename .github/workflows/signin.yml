name: TRAE 每日签到
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 写入账号凭证
        env:
          TRAE_AUTH: ${{ secrets.TRAE_AUTH_1 }}
        run: |
          mkdir -p auths
          printf '%s' "$TRAE_AUTH" > auths/trae-1.json

      - name: 运行签到
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          bash signin.sh