name: TRAE 每日签到
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 写入账号凭证
        env:
          TRAE_AUTH: ${{ secrets.TRAE_AUTH_1 }}
        run: |
          mkdir -p auths
          printf '%s' "$TRAE_AUTH" > auths/trae-1.json

      - name: 抓取积分明细（诊断，待移除）
        run: |
          python3 -c "import json,urllib.request as u;d=json.load(open('auths/trae-1.json'));tok=d['auth']['accessToken'];h={'Content-Type':'application/json','Accept':'application/json','User-Agent':'Trae/0.1.43','X-User-Region':'CN','Authorization':'Cloud-IDE-JWT '+tok};f=lambda p:json.loads(u.urlopen(u.Request('https://api.trae.cn'+p,data=b'{}',method='POST',headers=h),timeout=20).read().decode());lst=f('/trae/api/v2/pay/ide_user_ent_usage').get('user_entitlement_pack_list') or [];print('PACKS=%d'%len(lst));[print('P%d st=%s cr=%.2f nm=%s'%(i+1,l.get('status') or 0,(l.get('usage') or {}).get('credits_amount',0) or 0,(l.get('entitlement_package_name') or l.get('product_name') or ''))) for i,l in enumerate(lst)];print('SUM_ALL=%.2f'%sum(float((l.get('usage') or {}).get('credits_amount',0) or 0) for l in lst));print('SUM_S0=%.2f'%sum(float((l.get('usage') or {}).get('credits_amount',0) or 0) for l in lst if (l.get('status') or 0)==0))"

      - name: 执行签到并推送通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          chmod +x signin.sh
          bash signin.sh auths