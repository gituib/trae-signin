name: TRAE 每日签到
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 写入账号凭证
        env:
          TRAE_AUTH: ${{ secrets.TRAE_AUTH_1 }}
        run: |
          mkdir -p auths
          printf '%s' "$TRAE_AUTH" > auths/trae-1.json

      - name: 抓取 usage 字段（诊断用，待移除）
        env:
          AUTH: ${{ secrets.TRAE_AUTH_1 }}
        run: |
          TOKEN=$(python3 -c "import os,json;d=json.loads(os.environ['AUTH']);print(d['auth']['accessToken'])")
          curl -s -X POST "https://api.trae.cn/trae/api/v2/pay/ide_user_ent_usage" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H 'User-Agent: Trae/0.1.43' -H 'X-User-Region: CN' \
            -H "Authorization: Cloud-IDE-JWT $TOKEN" -d '{}' \
            | python3 -c "
import json,sys,base64
d=json.load(sys.stdin)
print('top_keys:', ','.join(d.keys()))
for i,p in enumerate(d.get('user_entitlement_pack_list',[]),1):
    u=p.get('usage') or {}
    print('pack%d group=%s status=%s limit=%s usage_b64=%s'%(i,p.get('group_name'),p.get('status'),(p.get('entitlement_base_info') or {}).get('quota',{}).get('credits_limit'),base64.b64encode(json.dumps(u).encode()).decode()))
"

      - name: 执行签到并推送通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          chmod +x signin.sh
          bash signin.sh auths